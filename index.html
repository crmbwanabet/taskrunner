<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LayerForge — Constitution-Driven Build Orchestrator</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060610; --surface: #0c0c1a; --surface2: #10101e;
    --border: #181830; --border-light: #222245;
    --accent: #5eead4; --accent2: #818cf8; --accent3: #f472b6;
    --red: #f43f5e; --green: #22c55e; --amber: #f59e0b; --blue: #3b82f6;
    --text: #e2e8f0; --dim: #64748b; --muted: #2e3348;
    --mono: 'IBM Plex Mono', 'JetBrains Mono', monospace;
    --sans: 'IBM Plex Sans', 'DM Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }
  *::-webkit-scrollbar { width: 5px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(94,234,212,0.2)} 50%{box-shadow:0 0 20px 4px rgba(94,234,212,0.1)} }

  .container { max-width: 1040px; margin: 0 auto; padding: 28px 20px; }

  /* Header */
  .header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:32px; }
  .logo { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .logo-icon { width:26px; height:26px; border-radius:7px; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--bg); }
  .logo h1 { font-size:20px; font-weight:700; font-family:var(--mono); letter-spacing:-0.02em; }
  .logo-sub { font-family:var(--mono); font-size:10px; color:var(--muted); letter-spacing:0.06em; }
  .header-right { display:flex; align-items:center; gap:12px; }
  .timer { font-family:var(--mono); font-size:16px; font-weight:600; color:var(--accent); font-variant-numeric:tabular-nums; }

  /* Phase bar */
  .phase-bar { display:flex; gap:2px; margin-bottom:4px; }
  .phase-seg { flex:1; height:2.5px; border-radius:2px; background:var(--border); transition:background 0.4s; }
  .phase-seg.active { background:var(--accent); }
  .phase-labels { display:flex; justify-content:space-between; margin-bottom:28px; }
  .phase-label { font-size:9px; font-family:var(--mono); color:var(--muted); }
  .phase-label.active { color:var(--accent); }
  .phase-label.done { color:var(--dim); }

  /* Buttons */
  .btn { padding:10px 20px; border-radius:10px; font-family:var(--mono); font-size:12px; cursor:pointer; border:none; transition:all 0.2s; }
  .btn-ghost { background:transparent; border:1px solid var(--border); color:var(--dim); }
  .btn-ghost:hover { border-color:var(--accent); color:var(--text); }
  .btn-primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:var(--bg); font-weight:700; box-shadow:0 4px 20px rgba(94,234,212,0.15); }
  .btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 24px rgba(94,234,212,0.25); }
  .btn-green { background:linear-gradient(135deg,var(--green),#16a34a); color:#fff; font-weight:700; box-shadow:0 4px 20px rgba(34,197,94,0.15); }
  .btn-red { background:var(--red); color:#fff; font-weight:600; }
  .btn-row { display:flex; gap:12px; margin-top:24px; }
  .btn-flex { flex:1; }
  .btn:disabled { opacity:0.4; cursor:not-allowed; }

  /* Upload zone */
  .upload-zone { border:2px dashed var(--border); border-radius:16px; padding:64px 40px; text-align:center; cursor:pointer; background:var(--surface); transition:all 0.3s; }
  .upload-zone:hover, .upload-zone.dragover { border-color:var(--accent); background:rgba(94,234,212,0.03); }
  .upload-zone .icon { font-size:48px; margin-bottom:20px; opacity:0.3; }
  .upload-zone .title { font-family:var(--mono); font-size:14px; color:var(--text); margin-bottom:8px; }
  .upload-zone .sub { font-family:var(--mono); font-size:11px; color:var(--dim); }
  .upload-hint { text-align:center; margin-top:20px; font-family:var(--mono); font-size:11px; color:var(--muted); }

  /* API key input */
  .key-section { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:24px; animation:fadeUp 0.4s ease; }
  .key-section label { font-family:var(--mono); font-size:11px; color:var(--dim); display:block; margin-bottom:8px; letter-spacing:0.03em; }
  .key-input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px 14px; color:var(--text); font-family:var(--mono); font-size:13px; outline:none; transition:border-color 0.2s; }
  .key-input:focus { border-color:var(--accent); }
  .key-input::placeholder { color:var(--muted); }
  .key-status { font-family:var(--mono); font-size:10px; margin-top:6px; }
  .key-status.ok { color:var(--green); }
  .key-status.err { color:var(--red); }

  /* Parsed view */
  .parsed-card { background:var(--surface); border-radius:14px; border:1px solid var(--border); padding:20px; }
  .section-title { font-family:var(--mono); font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:14px; }
  .parsed-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; }
  .parsed-item { padding:8px 12px; background:var(--bg); border-radius:8px; border:1px solid var(--border); }
  .parsed-item .label { font-family:var(--mono); font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:3px; }
  .parsed-item .value { font-family:var(--mono); font-size:12px; word-break:break-word; }
  .raw-preview { margin-top:16px; background:var(--bg); border-radius:12px; border:1px solid var(--border); max-height:200px; overflow:auto; padding:14px; }
  .raw-preview pre { font-family:var(--mono); font-size:10px; color:var(--dim); line-height:1.6; white-space:pre-wrap; }

  /* Agents */
  .agent-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; margin-bottom:16px; }
  .agent-card { position:relative; background:var(--surface); border-radius:12px; border:1.5px solid var(--border); padding:14px; transition:all 0.4s ease; }
  .agent-card.running { animation:pulse 2s ease-in-out infinite; }
  .agent-card.done { opacity:0.7; }
  .agent-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
  .agent-name { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
  .agent-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .agent-dot.running { animation:blink 1.2s ease-in-out infinite; }
  .agent-name span { font-family:var(--mono); font-size:11px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .agent-platform { font-family:var(--mono); font-size:9px; padding:2px 6px; border-radius:4px; flex-shrink:0; margin-left:6px; text-transform:uppercase; letter-spacing:0.05em; }
  .agent-desc { font-size:10px; color:var(--dim); font-family:var(--sans); margin-bottom:10px; line-height:1.5; }
  .agent-bar { height:2px; background:var(--border); border-radius:2px; overflow:hidden; margin-bottom:6px; }
  .agent-bar-fill { height:100%; border-radius:2px; transition:width 0.4s ease; }
  .agent-footer { display:flex; justify-content:space-between; font-size:9px; font-family:var(--mono); }

  /* Phase label */
  .phase-group-label { font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:8px; margin-top:12px; }

  /* Stats */
  .stats-row { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .stat-card { background:var(--surface); border-radius:8px; padding:8px 14px; border:1px solid var(--border); flex:1 1 80px; }
  .stat-label { font-family:var(--mono); font-size:8px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; }
  .stat-value { font-family:var(--mono); font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; }

  /* Log panel */
  .log-panel { background:var(--bg); border-radius:12px; border:1px solid var(--border); padding:14px; height:180px; overflow:auto; }
  .log-title { font-family:var(--mono); font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:8px; }
  .log-line { font-family:var(--mono); font-size:10px; line-height:1.8; }
  .log-line .time { color:var(--muted); }
  .log-line .agent { color:var(--dim); }

  /* File tree */
  .file-section { display:flex; gap:1px; height:460px; border-radius:14px; overflow:hidden; border:1px solid var(--border); }
  .file-tree { width:260px; background:var(--surface); overflow:auto; padding:8px 0; flex-shrink:0; border-right:1px solid var(--border); }
  .file-tree-title { font-family:var(--mono); font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; padding:6px 12px; margin-bottom:4px; }
  .file-tree-item { padding:4px 10px; font-size:11px; font-family:var(--mono); cursor:pointer; transition:all 0.15s; border-left:2px solid transparent; }
  .file-tree-item:hover { color:var(--accent); }
  .file-tree-item.selected { color:var(--accent); background:rgba(94,234,212,0.03); border-left-color:var(--accent); }
  .file-tree-dir { font-weight:600; color:var(--text); }
  .file-tree-file { color:var(--dim); }
  .file-preview { flex:1; background:var(--bg); overflow:auto; position:relative; }
  .file-preview-header { position:sticky; top:0; background:var(--surface2); padding:8px 16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; font-family:var(--mono); font-size:10px; z-index:1; }
  .file-preview pre { margin:0; padding:16px; font-family:var(--mono); font-size:11px; color:#94a3b8; line-height:1.7; white-space:pre-wrap; word-break:break-word; }
  .file-preview-empty { color:var(--muted); font-family:var(--mono); font-size:12px; padding:40px; text-align:center; }
  .download-row { display:flex; gap:8px; margin-bottom:10px; }

  /* Platform badges */
  .badge-row { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .badge { padding:4px 10px; border-radius:6px; font-family:var(--mono); font-size:10px; font-weight:600; }

  /* Features */
  .features-section { margin-top:16px; }
  .feature-platform { font-family:var(--mono); font-size:11px; margin-bottom:4px; }
  .feature-tags { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:10px; }
  .feature-tag { padding:3px 8px; border-radius:4px; font-family:var(--mono); font-size:10px; }

  .footer { text-align:center; margin-top:28px; font-family:var(--mono); font-size:9px; color:var(--muted); letter-spacing:0.1em; }

  .animate-in { animation: fadeUp 0.4s ease; }
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// LAYERFORGE — Single-file Constitution-Driven Build Orchestrator
// ═══════════════════════════════════════════════════════════════

const PHASE = { KEY: -1, UPLOAD: 0, PARSED: 1, AGENTS: 2, FOUNDATION: 3, EXECUTE: 4, OUTPUT: 5 };
const PHASE_NAMES = ["Upload", "Parsed", "Agents", "Foundation", "Build", "Output"];

let state = {
  phase: PHASE.KEY,
  apiKey: "",
  keyValid: false,
  rawText: "",
  fileName: "",
  parsed: null,
  agents: [],
  files: [],
  logs: [],
  isExecuting: false,
  elapsed: 0,
  timerInterval: null,
  runActive: false,
  selectedFile: null,
  expandedDirs: {},
};

// ─── PARSER ─────────────────────────────────────────────────────
function parseConstitution(text) {
  const r = { raw: text, projectName: "", description: "", platforms: [], techStack: {}, auth: {}, features: {}, dataModels: [], apiStyle: "", sections: {} };
  const nm = text.match(/^#\s+(.+)/m) || text.match(/Project\s*Name\s*[:=]\s*(.+)/im);
  if (nm) r.projectName = nm[1].trim();
  const dm = text.match(/Description\s*[:=]\s*(.+)/im);
  if (dm) r.description = dm[1].trim();

  const pp = text.match(/platforms?\s*[:=]\s*([\s\S]*?)(?=\n\s*\n|\n#|\n\w+\s*[:=])/im);
  if (pp) r.platforms = pp[1].split(/\n/).map(l => l.replace(/^[-*•]\s*/, "").trim()).filter(Boolean);
  if (r.platforms.length === 0) {
    const found = new Set();
    const rx = /(?:client|customer|admin|vendor|business|mobile|landing|marketing|api)[\s-]*(?:facing\s*)?(?:platform|dashboard|portal|app|site|panel)/gim;
    let m; while ((m = rx.exec(text)) !== null) found.add(m[0].trim());
    r.platforms = [...found];
  }

  const ts = text.match(/(?:tech(?:nology)?\s*stack|stack|technologies)\s*[:=]?\s*([\s\S]*?)(?=\n#{1,3}\s|\n\w+\s*[:=].*\n|$)/im);
  if (ts) {
    const t = ts[1];
    const x = (rx) => { const m = t.match(rx); return m ? m[1].trim() : ""; };
    r.techStack.frontend = x(/frontend\s*[:=\-]\s*(.+)/im);
    r.techStack.backend = x(/backend\s*[:=\-]\s*(.+)/im);
    r.techStack.database = x(/database\s*[:=\-]\s*(.+)/im);
    r.techStack.language = x(/language\s*[:=\-]\s*(.+)/im);
    r.techStack.styling = x(/styl(?:ing|e)\s*[:=\-]\s*(.+)/im);
    r.techStack.orm = x(/orm\s*[:=\-]\s*(.+)/im);
  }

  const au = text.match(/auth(?:entication)?\s*[:=]?\s*([\s\S]*?)(?=\n#{1,3}\s|\n\w+\s*[:=].*\n|$)/im);
  if (au) {
    const a = au[1];
    const mm = a.match(/method\s*[:=\-]\s*(.+)/im); if (mm) r.auth.methods = mm[1].trim();
    const pr = a.match(/provider\s*[:=\-]\s*(.+)/im); if (pr) r.auth.provider = pr[1].trim();
    const ro = a.match(/roles?\s*[:=\-]\s*(.+)/im); if (ro) r.auth.roles = ro[1].split(/[,;]/).map(s=>s.trim()).filter(Boolean);
  }

  const fs = text.match(/(?:features?|functionality)\s*[:=]?\s*([\s\S]*?)(?=\n#{1,2}\s|$)/im);
  if (fs) {
    let cur = "General";
    fs[1].split("\n").forEach(line => {
      const ph = line.match(/^[-*•]?\s*([\w\s/]+?)(?:platform|dashboard|portal|app|panel)?\s*[:=]/i);
      if (ph) { cur = ph[1].trim(); r.features[cur] = []; }
      else if (line.match(/^[-*•]\s+/)) {
        const f = line.replace(/^[-*•]\s+/, "").trim();
        if (f) { if (!r.features[cur]) r.features[cur] = []; r.features[cur].push(f); }
      }
    });
  }

  const mo = text.match(/(?:data\s*)?models?\s*[:=]\s*(.+)/im) || text.match(/entities\s*[:=]\s*(.+)/im);
  if (mo) r.dataModels = mo[1].split(/[,;]/).map(s=>s.trim()).filter(Boolean);

  const ap = text.match(/api\s*(?:style|architecture|type)\s*[:=]\s*(.+)/im);
  if (ap) r.apiStyle = ap[1].trim();

  return r;
}

// ─── AGENT GENERATOR ────────────────────────────────────────────
function generateAgents(parsed) {
  const agents = [];
  const colors = ["#5eead4","#818cf8","#f472b6","#fbbf24","#34d399","#fb923c","#f43f5e","#a78bfa"];

  const add = (id,name,phase,platform,color,icon,desc,prompt,tasks) => {
    agents.push({ id,name,phase,platform,color,icon,description:desc,prompt,status:"idle",totalSteps:tasks.length,completedSteps:0,currentTask:null,tasks });
  };

  add("shared-types","Shared Types & Interfaces","foundation","Shared","#818cf8","◆","TypeScript types, interfaces, enums shared across all platforms","shared type definitions, interfaces, and enums",["Entity types","API types","Enums & constants"]);
  add("api-contracts","API Contracts & Routes","foundation","Shared","#3b82f6","◈","All API endpoints, route signatures, validation schemas","API route definitions, endpoint contracts, and validation",["Route definitions","Validation schemas","API client utilities"]);
  add("database-schema","Database Schema & Models","foundation","Shared","#f472b6","⬢","Database schema, models, migrations, relationships","database schema, ORM models, migrations, and seed data",["Schema design","Model definitions","Migrations","Seed data"]);
  add("auth-system","Authentication System","foundation","Shared","#f59e0b","◉","Auth provider setup, middleware, role-based access","authentication system, middleware, role guards",["Auth config","Middleware & guards","RBAC"]);
  add("backend-core","Backend Server Core","foundation","Shared","#22c55e","⬡","Server setup, middleware stack, error handling","backend server setup, middleware, error handling",["Server bootstrap","Middleware","Error handling","Env config"]);

  parsed.platforms.forEach((platform, i) => {
    const color = colors[i % colors.length];
    const short = platform.replace(/\s*(platform|dashboard|portal|app|panel|site)\s*/gi,"").trim() || platform;
    const slug = short.toLowerCase().replace(/[^a-z0-9]/g,"-");
    add(`${slug}-layout`,`${short} — Layout & Routing`,"platform",short,color,"◧",`App shell, nav, routing for ${platform}`,`layout, navigation, routing for ${platform}`,["App shell","Navigation","Routes"]);
    add(`${slug}-pages`,`${short} — Pages & Features`,"platform",short,color,"◳",`Page components and features for ${platform}`,`page components and features for ${platform}`,["Pages","Features","Data hooks","State"]);
    add(`${slug}-ui`,`${short} — UI Components`,"platform",short,color,"◐",`Reusable UI components for ${platform}`,`reusable UI components for ${platform}`,["Forms","Data display","Modals"]);
  });

  return agents;
}

// ─── API CALL ───────────────────────────────────────────────────
async function callAgent(prompt) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-api-key": state.apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
    body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 4000, messages: [{ role: "user", content: prompt }] }),
  });
  if (!res.ok) throw new Error(`API error ${res.status}`);
  const data = await res.json();
  return data.content.map(c => c.text || "").join("");
}

// ─── LOG ────────────────────────────────────────────────────────
function addLog(agent, message, type = "log") {
  const time = new Date().toLocaleTimeString("en-US",{hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"});
  state.logs.push({ time, agent, message, type });
  if (state.logs.length > 400) state.logs = state.logs.slice(-400);
  render();
  const lp = document.querySelector(".log-panel");
  if (lp) lp.scrollTop = lp.scrollHeight;
}

function formatTime(s) { return `${Math.floor(s/60).toString().padStart(2,"0")}:${(s%60).toString().padStart(2,"0")}`; }

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ─── EXECUTE ────────────────────────────────────────────────────
async function executeBuild() {
  state.isExecuting = true; state.files = []; state.logs = []; state.elapsed = 0;
  state.runActive = true; state.phase = PHASE.FOUNDATION;
  state.timerInterval = setInterval(() => { state.elapsed++; render(); }, 1000);
  render();

  addLog("SYSTEM","Build pipeline initiated","info");

  const foundation = state.agents.filter(a => a.phase === "foundation");
  const platforms = state.agents.filter(a => a.phase === "platform");
  let sharedCtx = "";

  addLog("SYSTEM",`Phase 1: Foundation (${foundation.length} agents)`,"info");

  for (const agent of foundation) {
    if (!state.runActive) break;
    agent.status = "running"; agent.currentTask = agent.tasks[0]; render();
    addLog(agent.name,"Agent activated","info");

    const prompt = `You are a senior software engineer agent building: "${agent.name}".

PROJECT CONSTITUTION:
${state.parsed.raw}

PREVIOUSLY GENERATED SHARED CODE (import from paths, do NOT redefine):
${sharedCtx || "None yet — you are first."}

YOUR TASK: ${agent.prompt}
Tasks: ${agent.tasks.join(", ")}

RULES:
- Tech: ${state.parsed.techStack.language||"TypeScript"}, ${state.parsed.techStack.backend||"Node.js"}, ${state.parsed.techStack.database||"PostgreSQL"}, ${state.parsed.techStack.orm||"Prisma"}
- Proper imports referencing other files
- Generate 2-5 files

Return ONLY a valid JSON array: [{"path":"...","content":"...","language":"..."}]
No markdown, no backticks.`;

    try {
      const text = await callAgent(prompt);
      for (let i = 0; i < agent.tasks.length; i++) {
        if (!state.runActive) break;
        agent.completedSteps = i+1; agent.currentTask = agent.tasks[i]; render();
        addLog(agent.name,`✓ ${agent.tasks[i]}`,"success");
        await sleep(200);
      }
      let files;
      try { files = JSON.parse(text.replace(/```json\s*/g,"").replace(/```/g,"").trim()); }
      catch { files = [{path:`shared/${agent.id}/output.txt`,content:text,language:"text"}]; }

      sharedCtx += `\n\n--- ${agent.name} ---\n` + files.map(f=>`File: ${f.path}\n${f.content.slice(0,600)}`).join("\n\n");
      files.forEach(f => state.files.push({...f, agent:agent.name, platform:"Shared"}));
      agent.status = "done"; agent.completedSteps = agent.totalSteps; agent.currentTask = "Complete";
      addLog(agent.name,`Complete — ${files.length} files`,"success");
    } catch(err) {
      addLog(agent.name,`Error: ${err.message}`,"error");
      agent.status = "error"; agent.currentTask = err.message;
    }
    render();
  }

  if (!state.runActive) { cleanup(); return; }
  state.phase = PHASE.EXECUTE; render();

  addLog("SYSTEM",`Phase 2: Platforms (${platforms.length} agents, parallel)`,"info");

  const runPlatformAgent = async (agent) => {
    if (!state.runActive) return;
    agent.status = "running"; agent.currentTask = agent.tasks[0]; render();
    addLog(agent.name,"Agent activated","info");

    const feats = state.parsed.features[agent.platform] || state.parsed.features["General"] || [];
    const prompt = `You are a senior frontend engineer building: "${agent.name}" for "${agent.platform}".

PROJECT CONSTITUTION:
${state.parsed.raw}

SHARED FOUNDATION (import from these):
${sharedCtx}

PLATFORM: ${agent.platform}
FEATURES: ${feats.join(", ")||"See constitution"}

YOUR TASK: ${agent.prompt}
Tasks: ${agent.tasks.join(", ")}

RULES:
- Frontend: ${state.parsed.techStack.frontend||"React"}, Styling: ${state.parsed.techStack.styling||"Tailwind CSS"}
- Import shared types from their paths
- Place under "${agent.platform.toLowerCase().replace(/\s+/g,"-")}-app/"
- Generate 2-5 files

Return ONLY JSON array: [{"path":"...","content":"...","language":"..."}]`;

    try {
      const text = await callAgent(prompt);
      for (let i = 0; i < agent.tasks.length; i++) {
        if (!state.runActive) break;
        agent.completedSteps = i+1; agent.currentTask = agent.tasks[i]; render();
        addLog(agent.name,`✓ ${agent.tasks[i]}`,"success");
        await sleep(200+Math.random()*300);
      }
      let files;
      try { files = JSON.parse(text.replace(/```json\s*/g,"").replace(/```/g,"").trim()); }
      catch { files = [{path:`${agent.platform.toLowerCase().replace(/\s+/g,"-")}-app/output.txt`,content:text,language:"text"}]; }

      files.forEach(f => state.files.push({...f, agent:agent.name, platform:agent.platform}));
      agent.status = "done"; agent.completedSteps = agent.totalSteps; agent.currentTask = "Complete";
      addLog(agent.name,`Complete — ${files.length} files`,"success");
    } catch(err) {
      addLog(agent.name,`Error: ${err.message}`,"error");
      agent.status = "error"; agent.currentTask = err.message;
    }
    render();
  };

  for (let i = 0; i < platforms.length; i += 3) {
    if (!state.runActive) break;
    const batch = platforms.slice(i, i+3);
    addLog("SYSTEM",`Deploying: ${batch.map(a=>a.name).join(", ")}`,"info");
    await Promise.all(batch.map(runPlatformAgent));
    if (i+3 < platforms.length) await sleep(300);
  }

  if (state.runActive) { addLog("SYSTEM","Build complete!","success"); state.phase = PHASE.OUTPUT; }
  cleanup();
}

function cleanup() { clearInterval(state.timerInterval); state.isExecuting = false; state.runActive = false; render(); }

function stopBuild() { state.runActive = false; cleanup(); addLog("SYSTEM","Build stopped","error"); state.agents.forEach(a => { if (a.status==="running") { a.status="idle"; a.currentTask="Cancelled"; }}); render(); }

// ─── FILE TREE HELPERS ──────────────────────────────────────────
function buildTree(files) {
  const tree = {};
  files.forEach(f => {
    const parts = f.path.split("/");
    let cur = tree;
    parts.forEach((p,i) => {
      if (i === parts.length-1) cur[p] = { _file:true, content:f.content, language:f.language, agent:f.agent, path:f.path };
      else { if (!cur[p]) cur[p] = {}; cur = cur[p]; }
    });
  });
  return tree;
}

function renderTreeNode(node, path="", depth=0) {
  return Object.keys(node).filter(k=>k!=="_file"&&k!=="content"&&k!=="language"&&k!=="agent"&&k!=="path")
    .sort((a,b) => { if(node[a]?._file && !node[b]?._file) return 1; if(!node[a]?._file && node[b]?._file) return -1; return a.localeCompare(b); })
    .map(key => {
      const fp = path ? `${path}/${key}` : key;
      const item = node[key];
      if (!item || typeof item !== "object") return "";
      if (item._file) {
        const sel = state.selectedFile?.path === fp;
        return `<div class="file-tree-item file-tree-file ${sel?"selected":""}" style="padding-left:${12+depth*14}px" onclick="selectFile('${fp.replace(/'/g,"\\'")}')">
          ${key}
        </div>`;
      }
      const isOpen = state.expandedDirs[fp] !== false;
      return `<div>
        <div class="file-tree-item file-tree-dir" style="padding-left:${12+depth*14}px" onclick="toggleDir('${fp.replace(/'/g,"\\'")}')">
          <span style="color:var(--muted);margin-right:6px;font-size:9px">${isOpen?"▼":"▶"}</span>${key}/
        </div>
        ${isOpen ? renderTreeNode(item, fp, depth+1).join("") : ""}
      </div>`;
    });
}

window.toggleDir = (p) => { state.expandedDirs[p] = state.expandedDirs[p] === false ? true : false; render(); };
window.selectFile = (p) => {
  const find = (node, path) => {
    for (const key of Object.keys(node)) {
      const fp = path ? `${path}/${key}` : key;
      if (node[key]?._file && fp === p) return {...node[key], path:fp};
      if (node[key] && typeof node[key] === "object" && !node[key]._file) {
        const r = find(node[key], fp);
        if (r) return r;
      }
    }
    return null;
  };
  state.selectedFile = find(buildTree(state.files), "");
  render();
};

// ─── RENDER ─────────────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  const p = state.phase;
  const phaseIdx = Math.max(0, p);
  const foundation = state.agents.filter(a=>a.phase==="foundation");
  const platAgents = state.agents.filter(a=>a.phase==="platform");
  const platforms = [...new Set(platAgents.map(a=>a.platform))];
  const doneCount = state.agents.filter(a=>a.status==="done").length;

  const phaseBar = `
    <div class="phase-bar">${PHASE_NAMES.map((_,i)=>`<div class="phase-seg ${i<=phaseIdx?"active":""}"></div>`).join("")}</div>
    <div class="phase-labels">${PHASE_NAMES.map((n,i)=>`<span class="phase-label ${i===phaseIdx?"active":i<phaseIdx?"done":""}">${n}</span>`).join("")}</div>`;

  const header = `
    <div class="header">
      <div>
        <div class="logo">
          <div class="logo-icon">◈</div>
          <h1>LAYERFORGE</h1>
        </div>
        <div class="logo-sub">CONSTITUTION-DRIVEN BUILD ORCHESTRATOR</div>
      </div>
      <div class="header-right">
        ${state.isExecuting ? `<span class="timer">${formatTime(state.elapsed)}</span>` : ""}
        ${p > PHASE.UPLOAD && !state.isExecuting ? `<button class="btn btn-ghost" onclick="resetAll()">Reset</button>` : ""}
      </div>
    </div>`;

  const agentCard = (a) => {
    const pct = a.totalSteps > 0 ? Math.round((a.completedSteps/a.totalSteps)*100) : 0;
    const dotColor = a.status==="done"?"var(--green)":a.status==="error"?"var(--red)":a.status==="running"?a.color:"var(--muted)";
    const borderColor = a.status==="running"?a.color+"50":a.status==="done"?"var(--green)30":a.status==="error"?"var(--red)30":"var(--border)";
    const barColor = a.status==="done"?"var(--green)":a.status==="error"?"var(--red)":a.color;
    const platBg = a.phase==="foundation"?`${a.color}15`:`${a.color}15`;
    const platColor = a.phase==="foundation"?"var(--amber)":a.color;
    return `<div class="agent-card ${a.status}" style="border-color:${borderColor}; ${a.status==="running"?`box-shadow:0 0 20px ${a.color}10`:""}">
      <div class="agent-header">
        <div class="agent-name">
          <div class="agent-dot ${a.status==="running"?"running":""}" style="background:${dotColor};${a.status==="running"?`box-shadow:0 0 8px ${a.color}`:""}"></div>
          <span>${a.name}</span>
        </div>
        <span class="agent-platform" style="background:${platBg};color:${platColor}">${a.platform}</span>
      </div>
      <div class="agent-desc">${a.description}</div>
      <div class="agent-bar"><div class="agent-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
      <div class="agent-footer"><span style="color:var(--muted)">${a.currentTask||"Queued"}</span><span style="color:var(--dim)">${pct}%</span></div>
    </div>`;
  };

  const logPanel = `<div class="log-panel">
    <div class="log-title">Build Output</div>
    ${state.logs.length===0?`<div style="color:var(--muted);font-family:var(--mono);font-size:11px;font-style:italic">Waiting for build...</div>`:""}
    ${state.logs.map(l=>{
      const c = l.type==="error"?"var(--red)":l.type==="success"?"var(--green)":l.type==="info"?"var(--blue)":"var(--dim)";
      return `<div class="log-line" style="color:${c}"><span class="time">${l.time}</span> <span class="agent">[${l.agent}]</span> ${l.message}</div>`;
    }).join("")}
  </div>`;

  let content = "";

  // API KEY PHASE
  if (p === PHASE.KEY) {
    content = `<div class="animate-in">
      <div class="key-section">
        <label>Anthropic API Key</label>
        <input class="key-input" type="password" placeholder="sk-ant-..." value="${state.apiKey}" oninput="updateKey(this.value)">
        <div class="key-status ${state.keyValid?"ok":""}">
          ${state.apiKey.length > 0 ? (state.apiKey.startsWith("sk-ant-") ? "✓ Key format looks correct" : "⚠ Key should start with sk-ant-") : "Enter your API key from console.anthropic.com"}
        </div>
        <p style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:10px">
          Your key stays in browser memory only — it's never saved or stored anywhere.
        </p>
      </div>
      <button class="btn btn-primary btn-flex" onclick="confirmKey()" ${!state.apiKey.startsWith("sk-ant-")?"disabled":""} style="width:100%">Continue →</button>
    </div>`;
  }

  // UPLOAD
  else if (p === PHASE.UPLOAD) {
    content = `<div class="animate-in">
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
        <div class="icon">◈</div>
        <div class="title">${state.fileName ? `✓ ${state.fileName}` : "Drop your constitution file here"}</div>
        <div class="sub">Accepts .md, .txt, or .json — the file you built on Claude.ai</div>
      </div>
      <input type="file" id="fileInput" accept=".md,.txt,.json" style="display:none" onchange="handleFileInput(event)">
      <div class="upload-hint">Build your constitution file on Claude.ai first, then upload it here</div>
    </div>`;
  }

  // PARSED
  else if (p === PHASE.PARSED && state.parsed) {
    const ps = state.parsed;
    const items = [
      {l:"Project",v:ps.projectName,c:"var(--accent)"},{l:"Platforms",v:ps.platforms.join(", ")||"None detected",c:"var(--accent2)"},
      {l:"Frontend",v:ps.techStack.frontend,c:"var(--green)"},{l:"Backend",v:ps.techStack.backend,c:"var(--amber)"},
      {l:"Database",v:ps.techStack.database,c:"var(--accent3)"},{l:"Language",v:ps.techStack.language,c:"var(--blue)"},
      {l:"Styling",v:ps.techStack.styling,c:"#fb923c"},{l:"ORM",v:ps.techStack.orm,c:"var(--dim)"},
      {l:"Auth",v:ps.auth.provider||ps.auth.methods,c:"var(--amber)"},{l:"Roles",v:ps.auth.roles?.join(", "),c:"var(--accent3)"},
      {l:"API",v:ps.apiStyle,c:"var(--blue)"},{l:"Models",v:ps.dataModels.join(", "),c:"var(--accent)"},
    ].filter(i=>i.v);

    const feats = Object.keys(ps.features).length > 0 ? `<div class="features-section">
      <div class="section-title">Features by Platform</div>
      ${Object.entries(ps.features).map(([p,fs])=>`
        <div class="feature-platform" style="color:var(--accent2)">${p}</div>
        <div class="feature-tags">${fs.map(f=>`<span class="feature-tag" style="background:rgba(129,140,248,0.06);color:var(--dim)">${f}</span>`).join("")}</div>
      `).join("")}
    </div>` : "";

    content = `<div class="animate-in">
      <div class="parsed-card">
        <div class="section-title">Parsed Constitution</div>
        <div class="parsed-grid">${items.map(i=>`<div class="parsed-item"><div class="label">${i.l}</div><div class="value" style="color:${i.c}">${i.v}</div></div>`).join("")}</div>
        ${feats}
      </div>
      <div class="raw-preview"><div class="section-title">Raw Constitution</div><pre>${escHtml(state.rawText.slice(0,2000))}${state.rawText.length>2000?"\n...":""}</pre></div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="state.phase=PHASE.UPLOAD;render()">← Re-upload</button>
        <button class="btn btn-primary btn-flex" onclick="doGenerateAgents()">Generate Agents →</button>
      </div>
    </div>`;
  }

  // AGENTS
  else if (p === PHASE.AGENTS) {
    content = `<div class="animate-in">
      <h2 style="font-family:var(--mono);font-size:15px;font-weight:700;margin-bottom:4px">Agent Deployment Plan</h2>
      <p style="font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:20px">${state.agents.length} agents — ${foundation.length} foundation + ${platAgents.length} platform</p>
      <div class="phase-group-label" style="color:var(--amber)">◆ Phase 1 — Foundation (sequential)</div>
      <div class="agent-grid">${foundation.map(agentCard).join("")}</div>
      ${platforms.map(pl=>`
        <div class="phase-group-label" style="color:${platAgents.find(a=>a.platform===pl)?.color||"var(--accent)"}">◧ Phase 2 — ${pl} (parallel)</div>
        <div class="agent-grid">${platAgents.filter(a=>a.platform===pl).map(agentCard).join("")}</div>
      `).join("")}
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="state.phase=PHASE.PARSED;render()">← Back</button>
        <button class="btn btn-green btn-flex" onclick="executeBuild()">▶ EXECUTE ALL AGENTS</button>
      </div>
    </div>`;
  }

  // FOUNDATION + EXECUTE
  else if (p === PHASE.FOUNDATION || p === PHASE.EXECUTE) {
    const stats = [
      {l:"Agents",v:state.agents.length,c:"var(--accent2)"},{l:"Running",v:state.agents.filter(a=>a.status==="running").length,c:"var(--blue)"},
      {l:"Done",v:doneCount,c:"var(--green)"},{l:"Files",v:state.files.length,c:"var(--accent)"},
      {l:"Errors",v:state.agents.filter(a=>a.status==="error").length,c:"var(--red)"},
    ];
    content = `<div class="animate-in">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div>
          <h2 style="font-family:var(--mono);font-size:15px;font-weight:700;margin-bottom:4px">${p===PHASE.FOUNDATION?"⚡ Building Foundation...":"⚡ Building Platforms..."}</h2>
          <p style="font-family:var(--mono);font-size:11px;color:var(--dim)">${doneCount}/${state.agents.length} agents complete</p>
        </div>
        ${state.isExecuting?`<button class="btn btn-red" onclick="stopBuild()">■ STOP</button>`:""}
      </div>
      <div class="stats-row">${stats.map(s=>`<div class="stat-card"><div class="stat-label">${s.l}</div><div class="stat-value" style="color:${s.c}">${s.v}</div></div>`).join("")}</div>
      <div class="agent-grid">${state.agents.map(agentCard).join("")}</div>
      ${logPanel}
    </div>`;
  }

  // OUTPUT
  else if (p === PHASE.OUTPUT) {
    const tree = buildTree(state.files);
    const filePlats = [...new Set(state.files.map(f=>f.platform))];
    content = `<div class="animate-in">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div>
          <h2 style="font-family:var(--mono);font-size:15px;font-weight:700;margin-bottom:4px">📦 Build Complete</h2>
          <p style="font-family:var(--mono);font-size:11px;color:var(--dim)">${state.files.length} files — ${formatTime(state.elapsed)}</p>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost" onclick="rerun()">↻ Re-run</button>
          <button class="btn btn-ghost" onclick="resetAll()">New Project</button>
        </div>
      </div>
      <div class="badge-row">${filePlats.map(pl=>{
        const cnt=state.files.filter(f=>f.platform===pl).length;
        const ag=state.agents.find(a=>a.platform===pl);
        return `<span class="badge" style="background:${ag?.color||"var(--accent)"}12;color:${ag?.color||"var(--accent)"}">${pl} (${cnt})</span>`;
      }).join("")}</div>
      <div class="download-row">
        <button class="btn btn-ghost" onclick="downloadAll()">↓ Download All (JSON)</button>
        ${state.selectedFile?`<button class="btn btn-ghost" style="color:var(--accent)" onclick="downloadSelected()">↓ Download Selected</button>`:""}
      </div>
      <div class="file-section">
        <div class="file-tree">
          <div class="file-tree-title">Project Files (${state.files.length})</div>
          ${renderTreeNode(tree).join("")}
        </div>
        <div class="file-preview">
          ${state.selectedFile?`
            <div class="file-preview-header">
              <span style="color:var(--text)">${state.selectedFile.path}</span>
              <span style="color:var(--dim)">Agent: ${state.selectedFile.agent}</span>
            </div>
            <pre>${escHtml(state.selectedFile.content)}</pre>
          `:`<div class="file-preview-empty">← Select a file to preview</div>`}
        </div>
      </div>
      <div style="margin-top:16px">${logPanel}</div>
    </div>`;
  }

  app.innerHTML = header + (p >= PHASE.UPLOAD ? phaseBar : "") + content + `<div class="footer">LAYERFORGE v2.0</div>`;

  // Attach drag/drop after render
  const uz = document.getElementById("uploadZone");
  if (uz) {
    uz.ondragover = (e) => { e.preventDefault(); uz.classList.add("dragover"); };
    uz.ondragleave = () => uz.classList.remove("dragover");
    uz.ondrop = (e) => { e.preventDefault(); uz.classList.remove("dragover"); handleFile(e.dataTransfer.files[0]); };
  }
}

function escHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// ─── EVENT HANDLERS ─────────────────────────────────────────────
window.updateKey = (v) => { state.apiKey = v; state.keyValid = v.startsWith("sk-ant-"); render(); };
window.confirmKey = () => { if (state.apiKey.startsWith("sk-ant-")) { state.phase = PHASE.UPLOAD; render(); }};
window.handleFileInput = (e) => { handleFile(e.target.files[0]); };
window.handleFile = handleFile;

function handleFile(file) {
  if (!file) return;
  state.fileName = file.name;
  const reader = new FileReader();
  reader.onload = (e) => {
    state.rawText = e.target.result;
    state.parsed = parseConstitution(state.rawText);
    state.phase = PHASE.PARSED;
    render();
  };
  reader.readAsText(file);
}

window.doGenerateAgents = () => { state.agents = generateAgents(state.parsed); state.phase = PHASE.AGENTS; render(); };
window.rerun = () => {
  state.phase = PHASE.AGENTS; state.logs = []; state.files = []; state.selectedFile = null;
  state.agents.forEach(a => { a.status="idle"; a.completedSteps=0; a.currentTask=null; });
  render();
};
window.resetAll = () => {
  state = { ...state, phase:PHASE.UPLOAD, rawText:"", fileName:"", parsed:null, agents:[], files:[], logs:[], isExecuting:false, elapsed:0, selectedFile:null, expandedDirs:{} };
  render();
};
window.downloadAll = () => {
  const blob = new Blob([JSON.stringify(state.files,null,2)],{type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "layerforge-output.json"; a.click();
};
window.downloadSelected = () => {
  if (!state.selectedFile) return;
  const blob = new Blob([state.selectedFile.content],{type:"text/plain"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = state.selectedFile.path.split("/").pop(); a.click();
};

// ─── INIT ───────────────────────────────────────────────────────
render();
</script>
</body>
